components:
  schemas:
    Adoption:
      type: object
      properties:
        _id:
          type: string
          description: The auto-generated id of the adoption.
        owner:
          type: string
          description: The ID of the user adopting the pet.
        pet:
          type: string
          description: The ID of the pet being adopted.
        createdAt:
          type: string
          format: date-time
          description: The date of the adoption.
      example:
        _id: "64e1b7c5b4b4a4b4a4b4a4b6"
        owner: "64e1b7c5b4b4a4b4a4b4a4b4"
        pet: "64e1b7c5b4b4a4b4a4b4a4b5"
        createdAt: "2025-01-01T00:00:00.000Z"
paths:
  /api/adoptions:
    get:
      summary: Returns a list of all adoptions
      tags: [Adoptions]
      responses:
        "200":
          description: A list of adoptions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true 
                  message:
                    type: string
                    example: "Adopciones obtenidas exitosamente"
                  payload:
                    type: array
                    items:
                      $ref: '#/components/schemas/Adoption'

  /api/adoptions/{uid}/{pid}:
    post:
      summary: Create a new adoption
      tags: [Adoptions]
      parameters:
        - in: path
          name: uid
          schema:
            type: string
          required: true
          description: The User ID
        - in: path
          name: pid
          schema:
            type: string
          required: true
          description: The Pet ID
      responses:
        "201":
          description: The adoption was created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Adopción realizada exitosamente"
                  payload:
                    type: object
                    properties:
                      adoptionDetails:
                        type: object
                        properties:
                          owner:
                            type: object
                            properties:
                              id:
                                type: string
                                example: "64e1b7c5b4b4a4b4a4b4a4b4"
                              name:
                                type: string
                                example: "John Doe"
                              email:
                                type: string
                                example: "john.doe@example.com"
                          pet:
                            type: object
                            properties:
                              id:
                                type: string
                                example: "64e1b7c5b4b4a4b4a4b4a4b5"
                              name:
                                type: string
                                example: "Fido"
                              specie:
                                type: string
                                example: "Dog"
                          adoptedAt:
                            type: string
                            format: date-time
                            example: "2025-01-01T00:00:00.000Z"
        "400":
          description: Bad request (e.g., invalid IDs, pet already adopted).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      name:
                        type: string
                        example: "AdoptionValidationError"
                      message:
                        type: string
                        example: "La mascota no está disponible para adopción"
                      cause:
                        type: string
                        example: "La mascota ya ha sido adoptada por otro usuario"
                      timestamp:
                        type: string
                        format: date-time
                        example: "2025-01-01T00:00:00.000Z"
                      path:
                        type: string
                        example: "/api/adoptions/6894ebe1fb71e0f913875f9b/68b2645d967906fb232ac563"
  /api/adoptions/{aid}:
    get:
      summary: Get an adoption by ID
      tags: [Adoptions]
      parameters:
        - in: path
          name: aid
          schema:
            type: string
          required: true
          description: The Adoption ID
      responses:
        "200":
          description: The adoption details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Adopción encontrada"
                  payload:
                    $ref: '#/components/schemas/Adoption'
        "404":
          description: The adoption was not found.

  /api/adoptions/user/{uid}:
    get:
      summary: Get all adoptions for a specific user
      tags: [Adoptions]
      parameters:
        - in: path
          name: uid
          schema:
            type: string
          required: true
          description: The User ID
      responses:
        "200":
          description: A list of the user's adoptions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Adopciones del usuario obtenidas exitosamente"
                  payload:
                    type: array
                    items: 
                      $ref: '#/components/schemas/Adoption'
        "404":
          description: The user was not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      name:
                        type: string
                        example: "AdoptionValidationError"
                      message:
                        type: string
                        example: "El usuario no existe"
                      cause:
                        type: string
                        example: "El usuario no existe"
                      timestamp:
                        type: string
                        format: date-time
                        example: "2025-01-01T00:00:00.000Z"
                      path:
                        type: string
                        example: "/api/adoptions/user/6894ebe1fb71e0f913875f9b/"

